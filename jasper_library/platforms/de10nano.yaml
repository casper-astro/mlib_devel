name: de10nano
manufacturer: Intel
fpga: 5CSEBA6U23I7
family: "Cyclone V"
config_voltage: 3.3
backend_target: quartus
sources: []
mmbus_architecture: AXI4-Lite
mmbus_base_address: 0xFF200000
mmbus_address_alignment: 4
constraints: []

# Board-specific paths (relative to MLIB_DEVEL_PATH/jasper_library/)
# These are used by QuartusBackend.initialize() to locate board HDL assets.
reference_qsf: hdl_sources/de10nano/DE10_NANO_SoC_GHRD.qsf
soc_qip: hdl_sources/de10nano/soc_system/synthesis/soc_system.qip
ddr_hdl_path: hdl_sources/de10nano/DDR


provides:
  - fpga_clk1_50
  - fpga_clk2_50
  - fpga_clk3_50


pins:
  fpga_clk1_50:
    iostd: "3.3-V LVTTL"
    loc: PIN_V11
  fpga_clk2_50:
    iostd: "3.3-V LVTTL"
    loc: PIN_Y13
  fpga_clk3_50:
    iostd: "3.3-V LVTTL"
    loc: PIN_E11
  led:
    iostd: "3.3-V LVTTL"
    loc: [PIN_AA23, PIN_Y16, PIN_AE26, PIN_AF26, PIN_V15, PIN_V16, PIN_AA24, PIN_W15]
  sw:
    iostd: "3.3-V LVTTL"
    loc: [PIN_Y24, PIN_W24, PIN_W21, PIN_W20]
  oct_rzqin:
    iostd: "SSTL-15"
    loc: PIN_D25