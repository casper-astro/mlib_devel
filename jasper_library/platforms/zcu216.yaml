name: zcu216
manufacturer: Xilinx
fpga: xczu49dr-ffvf1760-2-e
family: rfsoc
config_voltage: 1.8
cfgbvs: GND
backend_target: vivado
mmbus_architecture: AXI4-Lite
mmbus_base_address: 0xA0000000
# How to address each 32-bit (i.e. 4 indicates byte-addressable)
mmbus_address_alignment: 4
sources: []
constraints: []

rfdc:
  # gen3 devices can internally route their input refclk or the output of the RFPLL
  # as the sample clock for adjacent tiles. See PG269. For such configurations,
  # tile 225 is the preferred tile when available. The zcu216/208 eval boards only
  # have the sample clock connected to tile 255.
  #
  # For gen1 and gen2 devices the `adc_clk_src` is the same as the tile index
  tile224:
    has_adc_clk: False
    adc_clk_src: 2
  tile225:
    has_adc_clk: True
    adc_clk_src: 2
  tile226:
    has_adc_clk: True
    adc_clk_src: 2
  tile227:
    has_adc_clk: False
    adc_clk_src: 2

  tile228:
    has_dac_clk: False
    dac_clk_src: 6
  tile229:
    has_dac_clk: True
    dac_clk_src: 6
  tile230:
    has_dac_clk: True
    dac_clk_src: 6
  tile231:
    has_dac_clk: False
    dac_clk_src: 6

onehundredgbe:
  refclk_freq_str: "156.25"
  include_rs_fec: 1
  ncommon: [2, 1, 1]

  # zcu216 has 2 cmacs (UG1075 v1.9 Fig. 1-54). The 4x25G sfp cage (port 0) is
  # the only onboard 100G connector using GTs. Two additional GT quads are
  # accessible via FMC+ for use with the cmacs. Each array entry maps a port
  # index to a cmac resource (e.g., port 0 → CMACE4_X0Y0). Using a supported
  # FMC+ card extends the number of ports, but since only two cmacs exist, one
  # cmac must be reused, so not all port pairings are possible.
  cmac_loc:
    - CMACE4_X0Y0 # port 0, 4x25 cage
    - CMACE4_X0Y0 # port 1, FMC+ first port
    - CMACE4_X0Y1 # port 2, FMC+ second port

  # modprs pin strapped, sfp tx enable not supported to be managed by 100g core.
  # It must be toggled by an fpga pin gpio (not yet in yaml), or use the onboard jumpers
  management_interface: []

provides:
  - adc_clk
  - axil_clk
  - sysref_in

pins:
  clk_100_p:
    iostd: LVDS_25
    loc: G12
  clk_100_n:
    iostd: LVDS_25
    loc: G11
  clk_125_p:
    iostd: LVDS_25
    loc: A13
  clk_125_n:
    iostd: LVDS_25
    loc: A12
  sync_in:
    iostd: LVCMOS18
    loc: L15

# NOTE: most of the IO constraints and clocking constraints are taken care of by
# the RFDC IP itself. Vivado has that baked into the output products of teh IP
# core. The only necessary pins below are the fabirc clocking related to
# multi-tile sync Adding additional pins and constraints would not hurt anything
# but provide more transparent less 'hand-wavy'
# RFDC clocking

  # `SYSREF_P/N_228` on bank 228
  # constraints determined by rfdc ip, iostandard and loc not set by user
  sysref_p:
    loc: D2
  sysref_n:
    loc: D1

  # `CLK104_PL_SYSREF_P/N` on HD bank 89, VCCO is 1.8 but LVDS_25 still
  # supported, see UG571 SelectIO Resources table 3-2 and DS926 tables 23, 24,
  # and 2
  pl_sysref_p:
    iostd: LVDS_25
    loc: E11
  pl_sysref_n:
    iostd: LVDS_25
    loc: D11

  # `CLK104_PL_CLK_P/N` on HD bank 89
  pl_clk_p:
    iostd: LVDS_25
    loc: E10
  pl_clk_n:
    iostd: LVDS_25
    loc: E9

  # Do not instantiate clock buffer inputs in the user design, part of the RF-ADC [PG269 v2.4 pg.153]
  adc_clk_224_p:
    loc: BA3
  adc_clk_224_n:
    loc: BB3

  # naming changes between quad- and dual-tile adcs
  # quad tile vinXZ
  # dual tile vinX_ZZ
  # X-tile location, Z refers to adc location in the tile (0-3), ZZ-is either 01
  # for lower ADC or 23 for upper
  vin00_p:
    loc: AU5
  vin00_n:
    loc: AU4

# 100 GbE
  # The 4 GTY lanes on the4x25 sfp cage are split, 2 to bank 128, 2 to bank 129
  # IDT 8A34001 output Q11 refclk1 GTY bank 128 P Y34 N Y35
  # IDT 8A34001 output Q7, refclk1 GTY bank 129 P T34 N T35
  qsfp_mgt_ref_clk_p:
    loc:
      - Y34 # bank 128, REFCLK1
      - P34 # bank 130, REFCLK0
      - K34 # bank 131, REFCLK0
  qsfp_mgt_ref_clk_n:
    loc:
      - Y35 # bank 128, REFCLK1
      - P35 # bank 130, REFCLK0
      - K35 # bank 131, REFCLK0
  qsfp_mgt_tx_p:
    loc: [V38, U36, P38, N36,    # bank 128 SFP[0:1] # bank 129 SFP[2:3]
          K38, J36, H38, G36,    # bank 130
          F34, E36, A36, C36]    # bank 131
  qsfp_mgt_tx_n:
    loc: [V39, U37, P39, N37,    # bank 128 SFP[0:1] # bank 129 SFP[2:3]
          K39, J37, H39, G37,    # bank 130
          F35, E37, A37, C37]    # bank 131
  qsfp_mgt_rx_p:
    loc: [AC41, AB39, W41, U41,  # bank 128 SFP[0:1] # bank 129 SFP[2:3]
           L41,  J41, G41, F39,  # bank 130
           E41,  D39, B39, C41]  # bank 131
  qsfp_mgt_rx_n:
     loc: [AC42, AB40, W42, U42, # bank 128 SFP[0:1] # bank 129 SFP[2:3]
            L42,  J42, G42, F40, # bank 130
            E42,  D40, B40, C42] # bank 131

  # iWave Quad QSFP28 FMC+ Control Signal Pinout
  # Note, this board has four ports, but only two are connected to fpga GTs:
  # `qsfp1` (top-left), and `qsfp2` (bottom-right).
  qsfp1_lpmode: # QSFP 1, top-left (stacked connector 1 top)
    iostd: LVCMOS18
    loc: [L28]
  qsfp1_intL:
    iostd: LVCMOS18
    loc: [L29]
  qsfp1_modprs:
    iostd: LVCMOS18
    loc: [F29]
  qsfp1_modsel:
    iostd: LVCMOS18
    loc: [E27]
  qsfp1_reset:
    iostd: LVCMOS18
    loc: [D27]

  qsfp2_lpmode: # QSFP 2, bottom-right (stacked connector 2 bottom)
    iostd: LVCMOS18
    loc: [F28]
  qsfp2_intL:
    iostd: LVCMOS18
    loc: [J27]
  qsfp2_modprs:
    iostd: LVCMOS18
    loc: [J28]
  qsfp2_modsel:
    iostd: LVCMOS18
    loc: [E29]
  qsfp2_reset:
    iostd: LVCMOS18
    loc: [F27]

  qsfp3_lpmode: # QSFP 3, top-right (stacked connector 2 top)
    iostd: LVCMOS18
    loc: [D29]
  qsfp3_intL:
    iostd: LVCMOS18
    loc: [C29]
  qsfp3_modprs:
    iostd: LVCMOS18
    loc: [A29]
  qsfp3_modsel:
    iostd: LVCMOS18
    loc: [B30]
  qsfp3_reset:
    iostd: LVCMOS18
    loc: [B31]

  qsfp4_lpmode: # QSFP 4, bottom left (stacked connector 1 bottom)
    iostd: LVCMOS18
    loc: [A32]
  qsfp4_intL:
    iostd: LVCMOS18
    loc: [C30]
  qsfp4_modprs:
    iostd: LVCMOS18
    loc: [C31]
  qsfp4_modsel:
    iostd: LVCMOS18
    loc: [A30]
  qsfp4_reset:
    iostd: LVCMOS18
    loc: [B32]

# zcu216 has 8 RGB LEDs (24 total) however, not all of the LEDs of the same
# color have the same voltage standard. Not sure how the tools can handle this
# if at all (probably just named custom io group)
  led_red:
    drive_strength: 8
    iostd: LVCMOS12
    loc:
      - AN14
      - AP16
      - AP14
      - AU16
      - AW12
      - AY16
      - BB12
      - E25
  led_green:
    drive_strength: 8
    iostd: [LVCMOS18, LVCMOS12]
    loc: [[C13, D14, D12, D13], [AW18, AV18, BA19, AP21]] #LED position 0-7

  led_blue:
    drive_strength: 8
    iostd: LVCMOS12
    loc:
      - B26
      - E24
      - G26
      - J23
      - L24
      - P21
      - AV21
      - AR21

  led:
    drive_strength: 8 #HP banks don't support the default of 12
    iostd: LVCMOS12
    loc:
      # red
      - AN14
      - AP16
      - AP14
      - AU16
      - AW12
      - AY16
      - BB12
      - E25
      # green - remaining 4 green leds are lvcmos18
      - AW18
      - AV18
      - BA19
      - AP21
      # blue
      - B26
      - E24
      - G26
      - J23
      - L24
      - P21
      - AV21
      - AR21

  adc_io:
    iostd: LVCMOS18
    loc: [AP10, AP11, AR11, AP12, AT10, AR10, AT12, AR12, AU11, AU12, AV10, AU10, AW9, AV9, AW11, AV11]

  dac_io:
    iostd: LVCMOS18
    loc: [F13, F14, A14, A15, C16, D16, E15, E16, B15, B16, C14, C15, E14, F15, B12, B13]
